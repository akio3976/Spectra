<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectra</title>
<style>
:root { --header-height: 80px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #eef1f5;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 16px 24px 80px;
    color: #1e2a3a;
}

/* ============ 顶部栏 ============ */
.header {
    background: white;
    padding: 12px 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    position: sticky;
    top: 8px;
    z-index: 100;
}
.header-brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #e63946, #f77f00, #06a77d, #2c7be5, #8e44ad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-brand { flex-shrink: 0; }
.header-spacer { flex: 1; min-width: 10px; }
.header-palette { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#paletteSelect {
    padding: 7px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    cursor: pointer;
    min-width: 160px;
    outline: none;
}
#paletteSelect:focus { border-color: #2c7be5; }
.stats { font-size: 13px; color: #6b7a8f; white-space: nowrap; }
.btn {
    padding: 7px 14px;
    background: #2c7be5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
}
.btn:hover { background: #1a5fc7; }
.btn-new { background: #06a77d; }
.btn-new:hover { background: #058a67; }
.header-divider {
    width: 1px; height: 28px;
    background: #e0e5ea; margin: 0 4px;
    flex-shrink: 0;
}
.btn-view-mode {
    padding: 7px 14px;
    background: #6b7a8f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    transition: background 0.15s;
}
.btn-view-mode:hover { background: #55636f; }
.btn-view-mode.scatter { background: #e63946; }
.btn-view-mode.scatter:hover { background: #c42d3a; }
.btn-view-mode .icon { font-size: 14px; }
.btn-settings {
    padding: 7px 16px;
    background: #1e2a3a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}
.btn-settings:hover { background: #0f1826; }

/* ============ 色组标签 ============ */
.group-nav {
    position: fixed;
    top: calc(var(--header-height) + 24px);
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 20px 20px 0;
    z-index: 95;
    max-height: calc(100vh - var(--header-height) - 100px);
    overflow: visible;
}
.group-tab {
    display: block;
    width: 104px;
    padding: 7px 12px 7px 16px;
    border-radius: 0 12px 12px 0;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 3px 3px 8px rgba(0,0,0,0.18);
    margin-left: -6px;
    transition: margin-left 0.28s cubic-bezier(0.34, 1.4, 0.5, 1),
                width 0.28s cubic-bezier(0.34, 1.4, 0.5, 1),
                box-shadow 0.25s, filter 0.25s;
    will-change: margin-left, width;
}
.group-tab:hover {
    margin-left: 0;
    filter: brightness(1.1);
    box-shadow: 4px 4px 14px rgba(0,0,0,0.24);
}
.group-tab.active {
    margin-left: 0;
    width: 126px;
    box-shadow: 6px 6px 18px rgba(0,0,0,0.3);
    filter: brightness(1.06);
}
@media (max-width: 1419px) {
    .group-tab { width: 34px; padding: 8px 6px; font-size: 0; border-radius: 0 10px 10px 0; }
    .group-tab.active { width: 48px; }
}

/* ============ 图表区 ============ */
.container { display: flex; flex-direction: column; gap: 30px; max-width: 1200px; margin: 0 auto; }
.chart-wrap {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 20px 24px 16px;
    scroll-margin-top: calc(var(--header-height) + 30px);
}
.chart-title { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
.chart-sub { font-size: 14px; color: #6b7a8f; margin-bottom: 10px; }
.chart-canvas-wrap { display: flex; justify-content: center; width: 100%; }
.chart-canvas-wrap canvas {
    width: 100%; height: auto; max-width: 1000px;
    background: #fafbfc; border-radius: 10px; border: 1px solid #e9edf2;
    cursor: default; display: block;
}
.legend-tags {
    display: flex; flex-wrap: wrap; gap: 6px 12px;
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid #e9edf2;
}
.legend-tags span {
    padding: 2px 12px; border-radius: 12px;
    font-size: 13px; font-weight: 500;
}

/* ============ 欢迎页 ============ */
.welcome {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - var(--header-height) - 120px);
    padding: 40px 20px;
}
.welcome-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    text-align: center;
    max-width: 480px;
    width: 100%;
}
.welcome-logo {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #e63946, #f77f00, #06a77d, #2c7be5, #8e44ad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
}
.welcome-tagline {
    font-size: 16px;
    color: #1e2a3a;
    font-weight: 500;
    margin-bottom: 8px;
}
.welcome-desc {
    font-size: 13px;
    color: #8895a8;
    line-height: 1.6;
    margin-bottom: 28px;
}
.welcome-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
}
.btn-primary-large {
    padding: 12px 28px;
    background: #2c7be5;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
}
.btn-primary-large:hover { background: #1a5fc7; transform: translateY(-1px); }
.btn-secondary-large {
    padding: 12px 28px;
    background: #f0f2f5;
    color: #4a5a6e;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
}
.btn-secondary-large:hover { background: #e0e5ea; }

/* ============ 侧栏触发条 ============ */
.list-trigger {
    position: fixed;
    right: 0; top: 50%;
    transform: translateY(-50%) translateX(0);
    width: 36px; padding: 16px 8px;
    background: #1e2a3a; color: white;
    border: none; border-radius: 10px 0 0 10px;
    cursor: pointer;
    writing-mode: vertical-rl;
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    letter-spacing: 3px;
    z-index: 92;
    box-shadow: -4px 4px 12px rgba(0,0,0,0.2);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.25s, background 0.25s;
}
.list-trigger:hover {
    background: #0f1826;
    box-shadow: -6px 6px 16px rgba(0,0,0,0.3);
    transform: translateY(-50%) translateX(-3px);
}
.list-trigger.hidden {
    transform: translateY(-50%) translateX(40px);
    pointer-events: none;
}

/* ============ 侧栏 ============ */
.side-panel {
    position: fixed;
    top: calc(var(--header-height) + 16px);
    right: 16px; bottom: 16px;
    width: 340px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex; flex-direction: column;
    overflow: hidden;
    z-index: 91;
    transform: translateX(calc(100% + 32px));
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
}
.side-panel.open { transform: translateX(0); }
.side-panel-header {
    flex-shrink: 0;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e9edf2;
    background: #fafbfc;
}
.side-panel-header h3 { font-size: 14px; font-weight: 600; }
.side-panel-close {
    background: none; border: none;
    font-size: 20px; cursor: pointer;
    color: #6b7a8f; padding: 0 6px; line-height: 1;
}
.side-panel-close:hover { color: #1e2a3a; }
.side-search {
    flex-shrink: 0;
    padding: 10px 16px;
    border-bottom: 1px solid #e9edf2;
    display: flex; gap: 8px; align-items: center;
    background: white;
}
.side-search input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    min-width: 0;
}
.side-search input:focus { border-color: #2c7be5; }
.side-search button {
    padding: 6px 14px;
    background: #2c7be5; color: white;
    border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer;
    white-space: nowrap;
}
.side-search button:hover { background: #1a5fc7; }
.side-list-header {
    flex-shrink: 0;
    padding: 8px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e9edf2;
    background: #fafbfc;
}
.side-list-header > span { font-size: 12px; font-weight: 600; }
.side-list-hint {
    font-size: 10px; color: #8895a8;
    font-weight: 400; margin-left: 6px;
}
.btn-add-color {
    padding: 4px 10px;
    background: #2c7be5; color: white;
    border: none; border-radius: 6px;
    font-size: 11px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
}
.btn-add-color:hover { background: #1a5fc7; }
.side-list-scroll { flex: 1; overflow-y: auto; }
.side-panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
.side-panel th {
    text-align: left;
    padding: 6px 8px;
    background: #f4f6f9;
    font-weight: 600;
    font-size: 10px;
    color: #4a5a6e;
    position: sticky; top: 0; z-index: 2;
}
.side-panel td {
    padding: 5px 8px;
    border-bottom: 1px solid #eef1f5;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
}
.side-panel tr:hover td { background: #f5f7fa; }
.side-panel .mini-swatch {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 6px;
    border: 1px solid rgba(0,0,0,0.1);
}
.side-panel .drag-handle {
    display: inline-block;
    color: #c0c8d2;
    cursor: grab;
    font-size: 12px;
    margin-right: 4px;
    user-select: none;
}
.side-panel tr:hover .drag-handle { color: #6b7a8f; }
.side-panel tr.dragging { opacity: 0.35; }
.side-panel tr.dragging .drag-handle { cursor: grabbing; }
.side-panel tr.drag-over-top td { box-shadow: inset 0 2px 0 0 #2c7be5; }
.side-panel tr.drag-over-bottom td { box-shadow: inset 0 -2px 0 0 #2c7be5; }
.side-panel .highlight-row td { background: #fff3cd !important; }

/* ============ 详情卡片 ============ */
.detail-card {
    position: fixed;
    bottom: 84px; left: 50%;
    z-index: 960;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
    padding: 12px 14px;
    width: 300px;
    max-height: calc(100vh - 200px);
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) translateY(12px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    pointer-events: none;
}
.detail-card.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
}
.detail-card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
    flex-shrink: 0;
}
.detail-card-swatch {
    width: 44px; height: 44px;
    border-radius: 8px;
    border: 2px solid #ddd;
    flex-shrink: 0;
}
.detail-card-title { flex: 1; min-width: 0; }
.detail-card-id {
    font-size: 15px; font-weight: 700;
    color: #1e2a3a; line-height: 1.2;
}
.detail-card-close {
    background: none; border: none;
    font-size: 16px; cursor: pointer;
    color: #8895a8; padding: 0 4px;
    line-height: 1; flex-shrink: 0;
    align-self: flex-start;
}
.detail-card-close:hover { color: #1e2a3a; }
.detail-card-body {
    font-size: 12px; line-height: 1.65;
    color: #4a5a6e;
    flex-shrink: 0;
}
.detail-card-body .row {
    display: flex; justify-content: space-between; gap: 8px;
    font-variant-numeric: tabular-nums;
}
.detail-card-body .row .label {
    color: #8895a8; font-weight: 500; flex-shrink: 0;
}
.detail-card-body .row .value {
    text-align: right;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
}
.detail-card-neighbors {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e9edf2;
    flex: 1;
    min-height: 0;
    flex-direction: column;
}
.detail-card-neighbors.has-items { display: flex; }
.detail-card-neighbors-title {
    font-size: 11px;
    color: #8895a8;
    font-weight: 500;
    margin-bottom: 6px;
    flex-shrink: 0;
}
.neighbor-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    overflow-y: auto;
    flex: 1;
    align-content: flex-start;
}
.neighbor-chip {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1.5px solid rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    user-select: none;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 2px;
    box-sizing: border-box;
}
.neighbor-chip:hover {
    transform: scale(1.1);
    box-shadow: 0 2px 8px rgba(0,0,0,0.22);
    z-index: 1;
    border-color: rgba(0,0,0,0.35);
}

/* ============ Tooltip ============ */
.tooltip {
    position: fixed;
    background: rgba(20, 22, 30, 0.94);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px; line-height: 1.6;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    z-index: 999;
    display: none;
    max-width: 240px;
}
.tooltip .id { font-weight: 700; font-size: 15px; }
.tooltip .rgb { color: #ddd; }
.tooltip .hex { color: #ffe9a8; }
.tooltip .hsv { color: #aad0ff; }

/* ============ 底部调色器（新布局） ============ */
.picker-trigger {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 510;
    padding: 10px 22px;
    background: #1e2a3a; color: white;
    border: none; border-radius: 24px;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.22);
    transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
    display: flex; align-items: center; gap: 6px;
}
.picker-trigger:hover {
    transform: translateX(-50%) translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.picker-trigger.hidden {
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(20px);
}
.color-picker {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.12);
    border-top: 1px solid #e3e8ee;
    z-index: 520;
    padding: 14px 24px 18px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.color-picker.open { transform: translateY(0); }
.picker-panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
}
.picker-panel-header h3 { font-weight: 600; font-size: 15px; }
.picker-close {
    background: none; border: none;
    font-size: 20px; cursor: pointer;
    color: #6b7a8f; padding: 0 6px; line-height: 1;
}
.picker-close:hover { color: #1e2a3a; }

.picker-panel-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 0;
}

/* 顶部行：编号、HEX、RGB、预览、信息、添加按钮 */
.picker-top-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}
.picker-field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #8895a8;
    font-weight: 500;
    flex-shrink: 0;
}
.picker-field > span:first-child {
    white-space: nowrap;
}
.picker-field input[type="text"],
.picker-field input[type="number"] {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    width: 80px;
    font-variant-numeric: tabular-nums;
    background: white;
    font-family: inherit;
}
.picker-field input[type="text"]:focus,
.picker-field input[type="number"]:focus {
    border-color: #2c7be5;
}
.picker-field input.triple-input {
    width: 48px;
    text-align: center;
    padding: 6px 4px;
}
/* 隐藏数字输入框的上下箭头 */
.picker-field input[type="number"]::-webkit-outer-spin-button,
.picker-field input[type="number"]::-webkit-inner-spin-button,
.slider-num::-webkit-outer-spin-button,
.slider-num::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.picker-field input[type="number"],
.slider-num {
    -moz-appearance: textfield;
    appearance: textfield;
}

.picker-preview {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 2px solid #ddd;
    flex-shrink: 0;
}
.picker-info {
    font-size: 12px;
    color: #4a5a6e;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
    flex-shrink: 0;
}
#addColorBtn {
    padding: 8px 22px;
    background: #2c7be5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    margin-left: auto;
    flex-shrink: 0;
}
#addColorBtn:hover { background: #1a5fc7; }

/* 底部行：HSV 滑块 */
.picker-bottom-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}
.slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 200px;
}
.slider-group .slider-label {
    font-size: 12px;
    color: #8895a8;
    font-weight: 600;
    width: 14px;
    flex-shrink: 0;
}
.slider-group input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #e0e5ea;
    outline: none;
    cursor: pointer;
}
.slider-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    border: 2px solid #666;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.slider-group input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    border: 2px solid #666;
    cursor: pointer;
}
#hSlider {
    background: linear-gradient(to right,
        #ff0000 0%, #ffff00 17%, #00ff00 33%,
        #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
}
.slider-group .slider-num {
    width: 56px;
    padding: 5px 6px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 6px;

<script>
/* =========================================================
   1. 工具函数
   ========================================================= */
function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const v = max;
    const delta = max - min;
    let h = 0, s = 0;
    if (max !== 0) s = delta / max;
    if (delta !== 0) {
        if (max === r) h = (g - b) / delta + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / delta + 2;
        else h = (r - g) / delta + 4;
        h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(v * 100)];
}
function hsvToRgb(h, s, v) {
    s /= 100; v /= 100;
    const c = v * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = v - c;
    let r, g, b;
    if (h < 60)      [r, g, b] = [c, x, 0];
    else if (h < 120)[r, g, b] = [x, c, 0];
    else if (h < 180)[r, g, b] = [0, c, x];
    else if (h < 240)[r, g, b] = [0, x, c];
    else if (h < 300)[r, g, b] = [x, 0, c];
    else             [r, g, b] = [c, 0, x];
    return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
    ];
}
function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v =>
        v.toString(16).padStart(2, '0').toUpperCase()
    ).join('');
}
function getGroupIndex(h, bounds) {
    const n = bounds.length;
    for (let i = 0; i < n; i++) {
        const start = bounds[i];
        const end = bounds[(i + 1) % n];
        if (start < end) {
            if (h >= start && h < end) return i;
        } else {
            if (h >= start || h < end) return i;
        }
    }
    return -1;
}
function pickTextColor(r, g, b) {
    const brightness = r * 0.299 + g * 0.587 + b * 0.114;
    return brightness > 140 ? '#1e2a3a' : '#ffffff';
}

/* =========================================================
   LocalStorage 持久化
   ========================================================= */
const STORAGE_KEY = 'spectra_data_v1';

function saveToStorage() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            palettes: palettes,
            currentPaletteIdx: currentPaletteIdx,
            savedAt: Date.now()
        }));
    } catch (e) {
        console.warn('Spectra 保存失败：', e);
    }
}

function loadFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !Array.isArray(obj.palettes)) return null;
        return obj;
    } catch (e) {
        console.warn('Spectra 读取失败：', e);
        return null;
    }
}

function clearStorage() {
    try {
        localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
}

   2. 数据
   ========================================================= */

const GROUP_PRESETS = [

    { name: "五分色相", desc: "视觉粗分 · 5 组",
      bounds: [345, 22, 70, 180, 245],
      titles: ["红色组", "黄色组", "绿色组", "蓝色组", "紫色组"] },
    { name: "八分色相", desc: "视觉细分 · 8 组",
      bounds: [345, 22, 60, 95, 160, 190, 240, 310],
      titles: ["红色组", "橙黄色组", "黄绿色组", "绿色组", "青色组", "蓝色组", "紫色组", "品红色组"] }

/* =========================================================
   5. 顶栏高度
   ========================================================= */
function setupHeaderHeightObserver() {
    const update = () => {
        document.documentElement.style.setProperty(
            '--header-height',
            headerEl.offsetHeight + 'px'
        );
    };
    if (window.ResizeObserver) {
        new ResizeObserver(update).observe(headerEl);
    }
    window.addEventListener('resize', update);
    update();
}

/* =========================================================
   6. 数据重建
   ========================================================= */
function getCurrentPalette() {
    return palettes[currentPaletteIdx] || null;
}
function rebuildData() {
    const p = getCurrentPalette();
    if (!p) { data = []; groups = []; bounds = []; groupTitles = []; return; }
    bounds = p.bounds.slice();
    groupTitles = p.groupTitles.slice();
    data = p.colors.map((c, i) => {
        const [r, g, b] = c.rgb;
        const hsv = rgbToHsv(r, g, b);
        const group = getGroupIndex(hsv[0], bounds);
        return { id: c.id, rgb: [r, g, b], hsv, group, order: i };
    });
    const n = groupTitles.length;
    groups = Array.from({ length: n }, () => []);
    data.forEach(d => {
        if (d.group >= 0 && d.group < n) groups[d.group].push(d);
    });
}

/* =========================================================
   10. 邻近点
   ========================================================= */
const PLOT_PARAMS = { margin: 55, W: 950, H: 600 };
function calcPlot() {
    const { margin, W, H } = PLOT_PARAMS;
    return { margin, plotW: W - 2 * margin, plotH: H - 2 * margin };
}
function computeNearby(targetId) {
    const target = data.find(d => d.id === targetId);
    if (!target || target.group === -1) return [];
    const groupData = groups[target.group];
    if (!groupData || groupData.length <= 1) return [];

    const { margin, plotW, plotH } = calcPlot();
    const tx = margin + (target.hsv[1] / 100) * plotW;
    const ty = margin + (1 - target.hsv[2] / 100) * plotH;
    const baseR = viewMode === 'scatter' ? 6 : 22;
    const maxDist = Math.max(baseR * 2, 20);

    const candidates = [];
    groupData.forEach(d => {
        if (d.id === targetId) return;
        const x = margin + (d.hsv[1] / 100) * plotW;
        const y = margin + (1 - d.hsv[2] / 100) * plotH;
        const dx = x - tx, dy = y - ty;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= maxDist) candidates.push(d);
    });

    candidates.sort((a, b) => a.order - b.order);
    return candidates.slice(0, 8);
}

/* =========================================================
   11. 详情卡片
   ========================================================= */
function showDetailCard(id) {
    const found = data.find(d => d.id === id);
    if (!found) return;

    const [r, g, b] = found.rgb;
    detailCardSwatch.style.background = `rgb(${r},${g},${b})`;
    detailCardId.textContent = found.id;
    detailCardBody.innerHTML = `
        <div class="row"><span class="label">RGB</span><span class="value">${r}, ${g}, ${b}</span></div>
        <div class="row"><span class="label">HEX</span><span class="value">${rgbToHex(r, g, b)}</span></div>
        <div class="row"><span class="label">HSV</span><span class="value">${found.hsv[0]}°, ${found.hsv[1]}%, ${found.hsv[2]}%</span></div>
    `;

    const nearby = computeNearby(id);
    if (nearby.length > 0) {
        detailCardNeighbors.classList.add('has-items');
        const chips = nearby.map(p => {
            const [nr, ng, nb] = p.rgb;
            const textColor = pickTextColor(nr, ng, nb);
            return `
                <div class="neighbor-chip"
                     data-id="${p.id}"
                     style="background:rgb(${nr},${ng},${nb}); color:${textColor};"
                     title="${p.id}">${p.id}</div>
            `;
        }).join('');
        detailCardNeighbors.innerHTML = `
            <div class="detail-card-neighbors-title">邻近 ${nearby.length} 个点（列表顺序）</div>
            <div class="neighbor-grid">${chips}</div>
        `;
        detailCardNeighbors.querySelectorAll('.neighbor-chip').forEach(el => {
            el.addEventListener('click', ev => {
                ev.stopPropagation();
                switchToPoint(el.dataset.id);
            });
        });
    } else {
        detailCardNeighbors.classList.remove('has-items');
        detailCardNeighbors.innerHTML = '';
    }

    detailCard.classList.add('show');
}

function hideDetailCard() {
    detailCard.classList.remove('show');
}
function isDetailCardVisible() {

}

detailCardClose.addEventListener('click', e => {

/* =========================================================
   12. 色组标签
   ========================================================= */
function setupGroupNav() {
    groupNav.innerHTML = '';
    const n = groupTitles.length;
    if (n === 0) return;

    for (let i = 0; i < n; i++) {
        const start = bounds[i];
        const end = bounds[(i + 1) % n];
        const span = (end - start + 360) % 360 || 360;
        const midH = (start + span / 2) % 360;
        const [r, g, b] = hsvToRgb(midH, 75, 68);
        const textColor = pickTextColor(r, g, b);
        const shortName = groupTitles[i].split('(')[0].trim() || `组${i + 1}`;

        const tab = document.createElement('button');
        tab.className = 'group-tab';
        tab.type = 'button';
        tab.dataset.group = i;
        tab.title = groupTitles[i];
        tab.textContent = shortName;
        tab.style.background = `rgb(${r},${g},${b})`;
        tab.style.color = textColor;
        tab.addEventListener('click', () => {
            const wrap = document.querySelector(`.chart-wrap[data-group="${i}"]`);
            if (wrap) {
                suppressScrollHide = true;
                wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { suppressScrollHide = false; }, 700);
            }
        });
        groupNav.appendChild(tab);
    }
    updateActiveTab();
}

function updateActiveTab() {
    const tabs = groupNav.querySelectorAll('.group-tab');
    if (tabs.length === 0) return;
    const wraps = document.querySelectorAll('.chart-wrap');
    if (wraps.length === 0) return;

    const headerH = headerEl.offsetHeight + 16;
    const refY = headerH + 40;
    let bestIdx = -1, bestDist = Infinity;

    wraps.forEach(wrap => {
        const rect = wrap.getBoundingClientRect();
        const centerY = rect.top + rect.height * 0.25;
        const dist = Math.abs(centerY - refY);
        if (rect.bottom > 0 && rect.top < window.innerHeight && dist < bestDist) {
            bestDist = dist;
            bestIdx = parseInt(wrap.dataset.group);
        }
    });

    tabs.forEach(t => {
        t.classList.toggle('active', parseInt(t.dataset.group) === bestIdx);
    });
}

let scrollRaf = null;
window.addEventListener('scroll', () => {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
        scrollRaf = null;
        updateActiveTab();
    });
}, { passive: true });
window.addEventListener('resize', updateActiveTab);

/* =========================================================
   13. 散点标签防冲突
   ========================================================= */
function layoutScatterLabels(ctx, allPoints, selectedId) {
    const sorted = [...allPoints].sort((a, b) => {
        const aSel = a.id === selectedId ? 1 : 0;
        const bSel = b.id === selectedId ? 1 : 0;
        if (aSel !== bSel) return bSel - aSel;
        return a.order - b.order;
    });

    const placed = [];
    const fontSize = 11;
    const textH = 13;
    const pad = 2;

    sorted.forEach(p => {
        const id = p.id;
        ctx.font = `600 ${fontSize}px -apple-system, sans-serif`;
        const textW = ctx.measureText(id).width;

        const candidates = [
            { dx: p.r + 3, dy: 0, align: 'left', baseline: 'middle' },
            { dx: -p.r - 3, dy: 0, align: 'right', baseline: 'middle' },
            { dx: 0, dy: -p.r - 3, align: 'center', baseline: 'bottom' },
            { dx: 0, dy: p.r + 3, align: 'center', baseline: 'top' },
            { dx: p.r + 3, dy: -p.r - 3, align: 'left', baseline: 'bottom' },
            { dx: -p.r - 3, dy: -p.r - 3, align: 'right', baseline: 'bottom' },
            { dx: p.r + 3, dy: p.r + 3, align: 'left', baseline: 'top' },
            { dx: -p.r - 3, dy: p.r + 3, align: 'right', baseline: 'top' }
        ];

        let chosen = null;

        for (const c of candidates) {
            const tx = p.x + c.dx;
            const ty = p.y + c.dy;
            let x0, x1, y0, y1;

            if (c.align === 'left')      { x0 = tx;              x1 = tx + textW; }
            else if (c.align === 'right'){ x1 = tx;              x0 = tx - textW; }
            else                          { x0 = tx - textW / 2;  x1 = tx + textW / 2; }

            if (c.baseline === 'middle')      { y0 = ty - textH / 2; y1 = ty + textH / 2; }
            else if (c.baseline === 'bottom') { y0 = ty - textH;     y1 = ty; }
            else                               { y0 = ty;              y1 = ty + textH; }

            const rect = { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };

            if (rect.x0 < 2 || rect.x1 > PLOT_PARAMS.W - 2) continue;
            if (rect.y0 < 2 || rect.y1 > PLOT_PARAMS.H - 2) continue;

            let conflict = false;
            for (const r of placed) {
                if (!(rect.x1 < r.x0 || rect.x0 > r.x1 || rect.y1 < r.y0 || rect.y0 > r.y1)) {
                    conflict = true;
                    break;
                }
            }
            if (conflict) continue;

            for (const other of allPoints) {
                if (other === p) continue;
                const odx = other.x - tx, ody = other.y - ty;
                if (Math.abs(odx) > 40 || Math.abs(ody) > 40) continue;
                const closestX = Math.max(rect.x0, Math.min(other.x, rect.x1));
                const closestY = Math.max(rect.y0, Math.min(other.y, rect.y1));
                const dx = other.x - closestX, dy = other.y - closestY;
                if (dx * dx + dy * dy < other.r * other.r) {
                    conflict = true;
                    break;
                }
            }
            if (conflict) continue;

            chosen = { c, tx, ty, x0, y0, x1, y1 };
            break;
        }

        if (chosen) {
            placed.push({ x0: chosen.x0, y0: chosen.y0, x1: chosen.x1, y1: chosen.y1 });
            ctx.textAlign = chosen.c.align;
            ctx.textBaseline = chosen.c.baseline;

            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255,255,255,0.92)';
            ctx.strokeText(id, chosen.tx, chosen.ty);

            ctx.fillStyle = id === selectedId ? '#d4a300' : '#1e2a3a';
            ctx.fillText(id, chosen.tx, chosen.ty);
        }
    });
}

/* =========================================================
   14. 核心渲染
   ========================================================= */
function drawAll(highlightId) {
    container.innerHTML = '';
    selectedId = highlightId || null;

    if (palettes.length === 0) {
        renderWelcome();
        return;
    }

    const n = groupTitles.length;
    if (n === 0) return;

    const currentGroups = Array.from({ length: n }, () => []);
    data.forEach(d => {
        if (d.group >= 0 && d.group < n) currentGroups[d.group].push(d);
    });
    if (previewItem && previewItem.group >= 0 && previewItem.group < n) {
        currentGroups[previewItem.group].push(previewItem);
    }

    currentGroups.forEach((groupData, groupIdx) => {
        renderChart(groupData, groupIdx, highlightId);
    });

    updateTableHighlight(highlightId);
    totalCount.textContent = `共 ${data.length} 种颜色`;
}

function renderWelcome() {
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.innerHTML = `
        <div class="welcome-card">
            <div class="welcome-logo">Spectra</div>
            <div class="welcome-tagline">为你的颜色系统建立秩序</div>
            <div class="welcome-desc">创建色板、定义分段方案，开始管理你的颜色集</div>
            <div class="welcome-actions">
                <button class="btn-primary-large" id="welcomeCreateBtn">+ 新建色板</button>
                <button class="btn-secondary-large" id="welcomeImportBtn">导入 JSON</button>
            </div>
        </div>
    `;
    container.appendChild(welcome);
    document.getElementById('welcomeCreateBtn').addEventListener('click', openCreatePalette);
    document.getElementById('welcomeImportBtn').addEventListener('click', () => importFile.click());
}

function renderChart(groupData, groupIdx, highlightId) {
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';
    wrap.dataset.group = groupIdx;

    const title = document.createElement('div');
    title.className = 'chart-title';
    title.textContent = groupTitles[groupIdx];
    wrap.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'chart-sub';
    sub.textContent = groupData.length === 0
        ? '暂无颜色  ·  饱和度 →  明度 ↑'
        : `共 ${groupData.length} 种颜色  ·  饱和度 →  明度 ↑`;
    wrap.appendChild(sub);

    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'chart-canvas-wrap';
    const canvas = document.createElement('canvas');
    canvas.width = PLOT_PARAMS.W;
    canvas.height = PLOT_PARAMS.H;
    canvasWrap.appendChild(canvas);
    wrap.appendChild(canvasWrap);

    if (groupData.length > 0) {
        const legend = document.createElement('div');
        legend.className = 'legend-tags';
        groupData.forEach(d => legend.appendChild(buildLegendTag(d)));
        wrap.appendChild(legend);
    }

    container.appendChild(wrap);

    const ctx = canvas.getContext('2d');
    const { margin, plotW, plotH } = calcPlot();
    const W = PLOT_PARAMS.W, H = PLOT_PARAMS.H;

    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#e0e5ea';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= 10; i++) {
        const x = margin + (i / 10) * plotW;
        const y = margin + (i / 10) * plotH;
        ctx.beginPath(); ctx.moveTo(x, margin); ctx.lineTo(x, margin + plotH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(margin + plotW, y); ctx.stroke();
    }
    ctx.strokeStyle = '#b0bcc9';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(margin, margin, plotW, plotH);

    ctx.fillStyle = '#4a5a6e';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('0', margin, H - margin + 8);
    ctx.fillText('50', margin + plotW / 2, H - margin + 8);
    ctx.fillText('100', margin + plotW, H - margin + 8);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('0', margin - 12, H - margin);
    ctx.fillText('50', margin - 12, H - margin - plotH / 2);
    ctx.fillText('100', margin - 12, margin);

    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('饱和度 S (%)', margin + plotW / 2, H - 6);
    ctx.textBaseline = 'bottom';
    ctx.fillText('明度 V (%)', 18, H / 2 + 6);

    const allPoints = groupData.map(d => {
        const s = d.hsv[1] / 100;
        const v = d.hsv[2] / 100;
        return {
            id: d.id,
            x: margin + s * plotW,
            y: margin + (1 - v) * plotH,
            r: viewMode === 'scatter' ? 6 : 22,
            rgb: d.rgb,
            hsv: d.hsv,
            group: groupIdx,
            order: d.order !== undefined ? d.order : 9999,
            data: d
        };
    });

    const sorted = [...allPoints].sort((a, b) => {
        const aHi = a.id === highlightId ? 1 : 0;
        const bHi = b.id === highlightId ? 1 : 0;
        return aHi - bHi;
    });

    sorted.forEach(p => {
        if (viewMode === 'scatter') drawScatterDot(ctx, p, highlightId);
        else drawColorPoint(ctx, p, highlightId);
    });

    if (viewMode === 'scatter') {
        layoutScatterLabels(ctx, allPoints, highlightId);
    }

    bindCanvasEvents(canvas, allPoints);
}

function drawColorPoint(ctx, p, highlightId) {
    const r = 22;
    const [R, G, B] = p.rgb;
    const isPreview = p.data && p.data.isPreview;

    ctx.shadowColor = 'rgba(0,0,0,0.12)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = `rgb(${R},${G},${B})`;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (isPreview) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 3;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    if (p.id === highlightId) {
        ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 4, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    const fontSize = Math.min(r * 0.75, 18);
    ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(p.id, p.x, p.y);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 6;
    ctx.fillText(p.id, p.x, p.y);
    ctx.shadowBlur = 0;
}

function drawScatterDot(ctx, p, highlightId) {
    const r = 6;
    const isPreview = p.data && p.data.isPreview;

    if (isPreview) ctx.fillStyle = '#FFD700';
    else ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
    ctx.fill();

    if (isPreview) {
        ctx.strokeStyle = '#c99a00';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    } else if (p.id === highlightId) {
        ctx.shadowColor = 'rgba(255, 215, 0, 0.9)';
        ctx.shadowBlur = 14;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 4, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

function buildLegendTag(d) {
    const [r, g, b] = d.rgb;
    const span = document.createElement('span');
    span.textContent = d.id;
    span.style.background = `rgb(${r},${g},${b})`;
    span.style.color = pickTextColor(r, g, b);
    span.style.cursor = 'pointer';
    span.style.transition = 'transform 0.15s, box-shadow 0.15s';
    if (d.isPreview) span.style.border = '2px solid #FFD700';
    span.addEventListener('mouseenter', function() {
        this.style.transform = 'scale(1.08)';
        this.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
    });
    span.addEventListener('mouseleave', function() {
        this.style.transform = 'scale(1)';
        this.style.boxShadow = 'none';
    });
    span.addEventListener('click', e => {
        e.stopPropagation();
        selectPoint(d.id, { scroll: true });
    });
    return span;
}

function bindCanvasEvents(canvas, points) {
    canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        let found = null;
        for (let p of points) {
            const dx = mouseX - p.x;
            const dy = mouseY - p.y;
            if (dx * dx + dy * dy <= (p.r + 6) * (p.r + 6)) { found = p; break; }
        }
        if (found) {
            tooltip.style.display = 'block';
            tooltip.innerHTML = `
                <div class="id">${found.id}</div>
                <div class="rgb">RGB: ${found.rgb.join(', ')}</div>
                <div class="hex">HEX: ${rgbToHex(found.rgb[0], found.rgb[1], found.rgb[2])}</div>
                <div class="hsv">HSV: ${found.hsv[0]}°, ${found.hsv[1]}%, ${found.hsv[2]}%</div>
            `;
            tooltip.style.left = (e.clientX + 16) + 'px';
            tooltip.style.top = (e.clientY - 20) + 'px';
            canvas.style.cursor = 'pointer';
        } else {
            tooltip.style.display = 'none';
            canvas.style.cursor = 'default';
        }
    });

    canvas.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
        canvas.style.cursor = 'default';
    });

    canvas.addEventListener('click', function(e) {
        if (points.length === 0) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        const candidates = [];
        for (let p of points) {
            const dx = mouseX - p.x;
            const dy = mouseY - p.y;
            const dist2 = dx * dx + dy * dy;
            const maxR = p.r * 2;
            if (dist2 <= maxR * maxR) {
                candidates.push({ p, dist2 });
            }
        }

        if (candidates.length === 0) return;

        let found = null;
        if (selectedId) {
            const current = candidates.find(c => c.p.id === selectedId);
            if (current) found = current.p;
        }
        if (!found) {
            candidates.sort((a, b) => a.dist2 - b.dist2);
            found = candidates[0].p;
        }

        e.stopPropagation();
        tooltip.style.display = 'none';
        selectPoint(found.id, { scroll: false });
    });
}

/* =========================================================
   15. 选中 / 切换
   ========================================================= */
function selectPoint(id, options = {}) {
    const found = data.find(d => d.id === id);
    if (!found) return;
    drawAll(id);
    if (options.scroll) {

function updateTableHighlight(highlightId) {
    document.querySelectorAll('#tableBody tr').forEach(row => {
        row.classList.remove('highlight-row');
        if (row.dataset.id === highlightId) row.classList.add('highlight-row');
    });
}

function buildTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    data.forEach((d, idx) => {
        const tr = document.createElement('tr');
        tr.dataset.id = d.id;
        tr.dataset.idx = idx;
        tr.draggable = true;

        const [r, g, b] = d.rgb;
        const swatch = `<span class="mini-swatch" style="background:rgb(${r},${g},${b});"></span>`;
        tr.innerHTML = `
            <td><span class="drag-handle" title="拖拽排序">☰</span>${swatch}${d.id}</td>
            <td>${r}, ${g}, ${b}</td>
            <td>${d.hsv[0]}°, ${d.hsv[1]}%, ${d.hsv[2]}%</td>
        `;

        tr.addEventListener('click', e => {
            if (e.target.classList.contains('drag-handle')) return;
            e.stopPropagation();
            selectPoint(d.id, { scroll: true });
        });

        tr.addEventListener('dragstart', e => {
            dragSrcIdx = idx;
            tr.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', d.id);
        });
        tr.addEventListener('dragend', () => {
            tr.classList.remove('dragging');
            document.querySelectorAll('#tableBody tr').forEach(row => {
                row.classList.remove('drag-over-top', 'drag-over-bottom');
            });
            dragSrcIdx = null;
        });
        tr.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (dragSrcIdx === null || dragSrcIdx === idx) return;
            const rect = tr.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            const before = e.clientY < midY;
            tr.classList.toggle('drag-over-top', before);
            tr.classList.toggle('drag-over-bottom', !before);
        });
        tr.addEventListener('dragleave', () => {
            tr.classList.remove('drag-over-top', 'drag-over-bottom');
        });
        tr.addEventListener('drop', e => {
            e.preventDefault();
            tr.classList.remove('drag-over-top', 'drag-over-bottom');
            if (dragSrcIdx === null || dragSrcIdx === idx) return;
            const rect = tr.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            const insertBefore = e.clientY < midY;
            const targetIdx = computeTargetIdx(dragSrcIdx, idx, insertBefore);
            if (targetIdx === dragSrcIdx) return;
            const p = getCurrentPalette();
            if (!p) return;
            const [moved] = p.colors.splice(dragSrcIdx, 1);
            p.colors.splice(targetIdx, 0, moved);
            rebuildData();
            buildTable();
            updateTableHighlight(selectedId);
    	    saveToStorage();
        });

        tbody.appendChild(tr);
    });
}

function computeTargetIdx(srcIdx, destIdx, insertBefore) {
    if (srcIdx < destIdx) return insertBefore ? destIdx - 1 : destIdx;
    if (srcIdx > destIdx) return insertBefore ? destIdx : destIdx + 1;
    return destIdx;
}

function doSearch() {

    const found = data.find(d => d.id === query);

}

async function exportPaletteAsJSON() {
    const p = getCurrentPalette();
    if (!p) return;
    const out = {
        version: "1.0",
        name: p.name,
        bounds: p.bounds,
        groupTitles: p.groupTitles,
        colors: p.colors
    };
    const filename = p.name.replace(/[\\/:*?"<>|\s]+/g, '_') + '.json';
    const content = JSON.stringify(out, null, 2);

    if (window.showSaveFilePicker) {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: filename,
                types: [{ description: 'JSON 文件', accept: { 'application/json': ['.json'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
            return;
        } catch (err) {
            if (err.name === 'AbortError') return;
        }
    }
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

importFile.addEventListener('change', e => {

    e.target.value = '';
});

function importPaletteFromJSON(file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const obj = JSON.parse(ev.target.result);
            if (!obj.colors || !Array.isArray(obj.colors)) throw new Error('缺少 colors 数组');
            if (!obj.bounds || !Array.isArray(obj.bounds)) throw new Error('缺少 bounds 数组');
            let titles = obj.groupTitles;
            if (!titles || titles.length !== obj.bounds.length) {
                titles = obj.bounds.map((b, i) => {
                    const next = obj.bounds[(i + 1) % obj.bounds.length];
                    return `组${i + 1} (${b}°~${next}°)`;
                });
            }
            const newPalette = {
                id: 'palette-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
                name: String(obj.name || '未命名色板'),
                bounds: obj.bounds.map(Number),
                groupTitles: titles.map(String),
                colors: obj.colors.map(c => ({
                    id: String(c.id ?? '?'),
                    rgb: [
                        Number(c.rgb?.[0] ?? 0),
                        Number(c.rgb?.[1] ?? 0),
                        Number(c.rgb?.[2] ?? 0)
                    ]
                }))
            };
            let baseName = newPalette.name;
            let counter = 2;
            while (palettes.some(p => p.name === newPalette.name)) {
                newPalette.name = baseName + ' (' + counter + ')';
                counter++;
            }
            palettes.push(newPalette);
            currentPaletteIdx = palettes.length - 1;
            refreshPaletteSelect();
            updateHeaderForPaletteState();
            rebuildData();
            buildTable();
            setupGroupNav();
            applyHSV(0, 100, 100);
            drawAll(null);
    	    saveToStorage();
            alert(`✅ 导入成功：${newPalette.name}\n共 ${newPalette.colors.length} 种颜色`);
        } catch (err) {
            alert('❌ 导入失败：' + err.message);
        }
    };
    reader.readAsText(file);
}

/**
 * 核心同步函数：所有输入都汇聚到这里
 * opts.skipHInput / skipSInput / skipVInput：跳过对应输入框的更新
 * opts.skipRGBInputs：跳过 RGB 三个输入框的更新
 * opts.skipHexInput：跳过 HEX 输入框的更新
 */
function applyHSV(h, s, v, opts = {}) {
    // 限制
    h = ((h % 360) + 360) % 360;
    s = Math.max(0, Math.min(100, Math.round(s)));
    v = Math.max(0, Math.min(100, Math.round(v)));

    // 更新滑块
    hSlider.value = h;
    sSlider.value = s;
    vSlider.value = v;

    // 更新 H/S/V 数字输入框
    if (!opts.skipHInput) hInput.value = h;
    if (!opts.skipSInput) sInput.value = s;
    if (!opts.skipVInput) vInput.value = v;

    // 计算 RGB
    const [r, g, b] = hsvToRgb(h, s, v);

    // 更新 RGB 输入框
    if (!opts.skipRGBInputs) {
        rInput.value = r;
        gInput.value = g;
        bInput.value = b;
    }

    // 更新 HEX 输入框
    if (!opts.skipHexInput) {
        hexInput.value = rgbToHex(r, g, b);
    }

    // 更新预览色块和信息
    pickerPreview.style.background = `rgb(${r},${g},${b})`;
    const group = getGroupIndex(h, bounds);
    pickerInfo.textContent = group === -1
        ? '未分类'
        : (groupTitles[group] || `组${group + 1}`);

    // 更新图表上的预览点
    if (previewActive) {
        const prevGroup = previewItem ? previewItem.group : -1;
        previewItem = {
            id: newIdInput.value.trim() || '?',
            rgb: [r, g, b],
            hsv: [h, s, v],
            group,
            isPreview: true
        };

        // H 跨组时自动跳转
        if (group !== -1 && group !== prevGroup && prevGroup !== -1) {
            const wrap = document.querySelector(`.chart-wrap[data-group="${group}"]`);
            if (wrap) {
                suppressScrollHide = true;
                wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { suppressScrollHide = false; }, 700);
            }
        }

        drawAll(selectedId);
    } else {
        previewItem = null;
    }
}

function scheduleApplyHSV(h, s, v, opts) {
    if (pickerRaf) return;
    pickerRaf = requestAnimationFrame(() => {
        pickerRaf = null;
        applyHSV(h, s, v, opts);
    });
}

/* -------- 滑块 -------- */
hSlider.addEventListener('input', () => {

});

});

});

sInput.addEventListener('input', () => {

/* -------- RGB 数字输入框 -------- */
function onRGBInput(sourceKey) {
    const r = parseInt(rInput.value) || 0;
    const g = parseInt(gInput.value) || 0;
    const b = parseInt(bInput.value) || 0;
    const [h, s, v] = rgbToHsv(r, g, b);
    applyHSV(h, s, v, { skipRGBInputs: true });
}
rInput.addEventListener('input', () => onRGBInput('r'));

[rInput, gInput, bInput].forEach(inp => {
    inp.addEventListener('blur', () => {
        const v = parseInt(inp.value);
        inp.value = isNaN(v) ? 0 : Math.max(0, Math.min(255, v));
    });
});

/* -------- HEX 输入框 -------- */
function applyHex(hex6) {
    const r = parseInt(hex6.substr(0, 2), 16);
    const g = parseInt(hex6.substr(2, 2), 16);
    const b = parseInt(hex6.substr(4, 2), 16);
    const [h, s, v] = rgbToHsv(r, g, b);
    applyHSV(h, s, v, { skipHexInput: true });
}

hexInput.addEventListener('input', () => {
    let hex = hexInput.value.trim().replace(/^#/, '');
    let expanded = null;
    if (hex.length === 3 && /^[0-9a-fA-F]{3}$/.test(hex)) {
        expanded = hex.split('').map(c => c + c).join('');
    } else if (hex.length === 6 && /^[0-9a-fA-F]{6}$/.test(hex)) {
        expanded = hex;
    }
    if (expanded) applyHex(expanded);
});

hexInput.addEventListener('blur', () => {
    let hex = hexInput.value.trim().replace(/^#/, '');
    if (hex.length === 3 && /^[0-9a-fA-F]{3}$/.test(hex)) {
        hex = hex.split('').map(c => c + c).join('');
    }
    if (hex.length === 6 && /^[0-9a-fA-F]{6}$/.test(hex)) {
        hexInput.value = '#' + hex.toUpperCase();
    } else {
        const [r, g, b] = hsvToRgb(+hSlider.value || 0, +sSlider.value || 0, +vSlider.value || 0);
        hexInput.value = rgbToHex(r, g, b);
    }

function openCreatePalette() {

function renderCreatePresetCards() {
    createPresetGrid.innerHTML = '';
    GROUP_PRESETS.forEach((preset, idx) => {
        const card = document.createElement('div');
        card.className = 'preset-card';
        card.dataset.presetIdx = idx;
        if (idx === createDraft.selectedPresetIdx) card.classList.add('selected');

        const ring = document.createElement('div');
        ring.className = 'preset-ring';
        const n = preset.bounds.length;
        for (let i = 0; i < n; i++) {
            const start = preset.bounds[i];
            const end = preset.bounds[(i + 1) % n];
            const span = (end - start + 360) % 360 || 360;
            const midH = (start + span / 2) % 360;
            const [r, g, b] = hsvToRgb(midH, 85, 90);
            const div = document.createElement('div');
            div.style.flex = span;
            div.style.background = `rgb(${r},${g},${b})`;
            ring.appendChild(div);
        }
        card.appendChild(ring);

        const name = document.createElement('div');
        name.className = 'preset-name';
        name.textContent = preset.name;
        card.appendChild(name);

        const desc = document.createElement('div');
        desc.className = 'preset-desc';
        desc.textContent = preset.desc;
        card.appendChild(desc);

        card.addEventListener('click', () => applyPresetToCreateDraft(idx));
        createPresetGrid.appendChild(card);
    });
}

function applyPresetToCreateDraft(presetIdx) {
    const preset = GROUP_PRESETS[presetIdx];
    if (!preset) return;
    createDraft.bounds = preset.bounds.slice();
    createDraft.groupTitles = preset.titles.slice();
    createDraft.selectedPresetIdx = presetIdx;
    renderCreateGroupConfig();
    createPresetGrid.querySelectorAll('.preset-card').forEach(c => c.classList.remove('selected'));

        const tr = document.createElement('tr');

        seen.add(b);
    }

    const newPalette = {
        id: 'palette-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        name: name,
        bounds: createDraft.bounds.slice(),
        groupTitles: createDraft.groupTitles.slice(),
        colors: []
    };
    palettes.push(newPalette);
    currentPaletteIdx = palettes.length - 1;

    rebuildData();
    buildTable();
    setupGroupNav();

const settingsApply    = document.getElementById('settingsApply');
const presetGrid       = document.getElementById('presetGrid');
const groupConfigBody  = document.getElementById('groupConfigBody');
const paletteNameInput = document.getElementById('paletteNameInput');

function renderSettingsPresetCards() {
    presetGrid.innerHTML = '';
    GROUP_PRESETS.forEach((preset, idx) => {
        const card = document.createElement('div');
        card.className = 'preset-card';
        card.dataset.presetIdx = idx;

        const ring = document.createElement('div');
        ring.className = 'preset-ring';
        const n = preset.bounds.length;
        for (let i = 0; i < n; i++) {
            const start = preset.bounds[i];
            const end = preset.bounds[(i + 1) % n];
            const span = (end - start + 360) % 360 || 360;
            const midH = (start + span / 2) % 360;
            const [r, g, b] = hsvToRgb(midH, 85, 90);
            const div = document.createElement('div');
            div.style.flex = span;
            div.style.background = `rgb(${r},${g},${b})`;
            ring.appendChild(div);
        }
        card.appendChild(ring);

        const name = document.createElement('div');
        name.className = 'preset-name';
        name.textContent = preset.name;
        card.appendChild(name);

        const desc = document.createElement('div');
        desc.className = 'preset-desc';
        desc.textContent = preset.desc;
        card.appendChild(desc);

        card.addEventListener('click', () => applyPresetToSettingsDraft(idx));
        presetGrid.appendChild(card);
    });
}

function applyPresetToSettingsDraft(presetIdx) {
    const preset = GROUP_PRESETS[presetIdx];
    if (!preset) return;
    settingsDraft.bounds = preset.bounds.slice();
    settingsDraft.groupTitles = preset.titles.slice();
    renderSettingsGroupConfig();
    presetGrid.querySelectorAll('.preset-card').forEach(c => c.classList.remove('selected'));
    presetGrid.querySelector(`.preset-card[data-preset-idx="${presetIdx}"]`)?.classList.add('selected');
}

function renderSettingsGroupConfig() {
    groupConfigBody.innerHTML = '';
    const n = settingsDraft.bounds.length;
    for (let i = 0; i < n; i++) {
        const tr = document.createElement('tr');
        const [r, g, b] = hsvToRgb(settingsDraft.bounds[i], 80, 90);
        const swatch = `<span class="swatch-mini" style="background:rgb(${r},${g},${b});"></span>`;
        tr.innerHTML = `
            <td>${swatch}${i + 1}</td>
            <td><input type="number" min="0" max="359" step="1" data-idx="${i}" value="${settingsDraft.bounds[i]}"></td>
            <td><input type="text" data-idx="${i}" value="${settingsDraft.groupTitles[i] || ''}" placeholder="组 ${i + 1}"></td>
        `;
        groupConfigBody.appendChild(tr);
    }
    groupConfigBody.querySelectorAll('input[type="number"]').forEach(inp => {
        inp.addEventListener('input', e => {
            const idx = parseInt(e.target.dataset.idx);
            settingsDraft.bounds[idx] = Math.max(0, Math.min(359, parseInt(e.target.value) || 0));
        });
    });
    groupConfigBody.querySelectorAll('input[type="text"]').forEach(inp => {
        inp.addEventListener('input', e => {
            const idx = parseInt(e.target.dataset.idx);
            settingsDraft.groupTitles[idx] = e.target.value;
        });
    });
}

function openSettings() {
    const p = getCurrentPalette();
    if (!p) return;
    settingsDraft = {
        bounds: p.bounds.slice(),
        groupTitles: p.groupTitles.slice(),
        name: p.name
    };
    paletteNameInput.value = settingsDraft.name;
    renderSettingsPresetCards();
    renderSettingsGroupConfig();
    settingsDrawer.classList.add('open');
    settingsOverlay.classList.add('open');
}

function closeSettings() {
    settingsDrawer.classList.remove('open');
    settingsOverlay.classList.remove('open');
    settingsDraft = null;
}

function applySettings() {
    const p = getCurrentPalette();
    if (!p || !settingsDraft) return;
    const seen = new Set();
    for (const b of settingsDraft.bounds) {
        if (seen.has(b)) { alert('分段角度不能重复，请检查后重试'); return; }
        seen.add(b);
    }
    p.bounds = settingsDraft.bounds.slice();
    p.groupTitles = settingsDraft.groupTitles.slice();
    p.name = paletteNameInput.value.trim() || p.name;
    refreshPaletteSelect();
    rebuildData();
    buildTable();
    setupGroupNav();
    applyHSV(0, 100, 100);
    drawAll(null);
    closeSettings();
    saveToStorage();
}

settingsBtn.addEventListener('click', e => { e.stopPropagation(); openSettings(); });
settingsClose.addEventListener('click', closeSettings);
settingsCancel.addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', closeSettings);
settingsApply.addEventListener('click', applySettings);

document.getElementById('clearStorageBtn').addEventListener('click', () => {
    if (!confirm('确定清空浏览器中保存的所有色板数据？此操作不可撤销。')) return;
    clearStorage();
    palettes = JSON.parse(JSON.stringify(DEFAULT_PALETTES));
    currentPaletteIdx = palettes.length > 0 ? 0 : -1;
    refreshPaletteSelect();
    updateHeaderForPaletteState();
    rebuildData();
    buildTable();
    setupGroupNav();
    closeSettings();
    drawAll(null);
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (createPaletteModal.classList.contains('open')) closeCreatePalette();
        else if (settingsDrawer.classList.contains('open')) closeSettings();
        else if (isDetailCardVisible()) hideDetailCard();
        else if (colorPicker.classList.contains('open')) closePicker();
    }
});

/* =========================================================
   21. 初始化
   ========================================================= */
function init() {
    const saved = loadFromStorage();
    if (saved) {
        palettes = saved.palettes;
        currentPaletteIdx = typeof saved.currentPaletteIdx === 'number'
            ? saved.currentPaletteIdx
            : (palettes.length > 0 ? 0 : -1);
        // 索引越界保护
        if (currentPaletteIdx >= palettes.length) currentPaletteIdx = palettes.length - 1;
        if (currentPaletteIdx < 0 && palettes.length > 0) currentPaletteIdx = 0;
    } else {
        palettes = JSON.parse(JSON.stringify(DEFAULT_PALETTES));
        currentPaletteIdx = palettes.length > 0 ? 0 : -1;
    }

    setupHeaderHeightObserver();
    updateViewModeBtn();
    refreshPaletteSelect();
    updateHeaderForPaletteState();
    rebuildData();
    buildTable();
    drawAll(null);
    setupGroupNav();
    setTimeout(updateActiveTab, 200);
    console.log('✅ Spectra 已就绪，已加载 ' + palettes.length + ' 个色板');
}
init();
</script>
